<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<!-- HPOS_BASE -->
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: $GODOT_SPLASH_COLOR;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<!-- hub-sdk before engine boot. Relative URLs follow <base href> when a base path is set. -->
		<script type="module">
import { createHubSdk, installHubSdk } from "./hub-sdk/index.js";
// Dev default. Export replaces this when HPOS_HUB_URL is set (absolute https://<domain>/hub/).
window.hposHubUrl = "/hub/";
// Empty keeps index.js, the wasm and the pack relative to this page.
// Export sets this from the Web preset html/base_path, or from HPOS_BASE_PATH.
window.hposBasePath = "";
installHubSdk(createHubSdk({
	serverUrl: "",
	hubUrl: window.hposHubUrl,
}));
window.hposDescribe = function (value) {
	try {
		return JSON.stringify(value === undefined ? null : value);
	} catch (error) {
		return JSON.stringify({ message: String(error && error.message || error) });
	}
};
window.hposDescribeError = function (error) {
	return JSON.stringify({
		code: error && error.code ? String(error.code) : "rejected",
		message: error && error.message ? String(error.message) : String(error),
	});
};
		</script>
		<script type="module">
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		// Relative names stay relative when hposBasePath is empty, so they
		// follow this page. A build-time base (html/base_path or HPOS_BASE_PATH)
		// is passed to Engine as the wasm/pack location. <base href> covers the
		// script, splash and any other relative URL. fileSizes keys are copied
		// onto those URLs so the loading bar still has a total.
		function hposAsset(file) {
			const base = window.hposBasePath || '';
			if (!base) {
				return file;
			}
			const value = String(file);
			if (/^[a-z][a-z0-9+.-]*:/i.test(value) || value.startsWith('//') || value.startsWith('data:') || value.startsWith('#') || value.startsWith('mailto:')) {
				return value;
			}
			if (value === '/hub' || value.startsWith('/hub/') || value.startsWith('/hub?') || value.startsWith('/hub#')) {
				return value;
			}
			const root = base.endsWith('/') ? base : base + '/';
			if (value.startsWith('/')) {
				let pathBase = root;
				if (/^https?:\/\//i.test(root)) {
					pathBase = new URL(root).pathname;
					if (!pathBase.endsWith('/')) {
						pathBase += '/';
					}
				}
				if (pathBase !== '/' && (value === pathBase.slice(0, -1) || value.startsWith(pathBase))) {
					return /^https?:\/\//i.test(root) ? new URL(root).origin + value : value;
				}
				if (pathBase === '/' && !/^https?:\/\//i.test(root)) {
					return value;
				}
				return root.replace(/\/$/, '') + value;
			}
			const rel = value.startsWith('./') ? value.slice(2) : value;
			return root + rel.replace(/^\/+/, '');
		}
		const onProgress = function (current, total) {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
			} else {
				statusProgress.removeAttribute('value');
				statusProgress.removeAttribute('max');
			}
		};
		const startOverride = { 'onProgress': onProgress };
		const basePath = window.hposBasePath || '';
		if (basePath) {
			const exe = GODOT_CONFIG.executable;
			const pack = GODOT_CONFIG.mainPack || (exe + '.pck');
			const resolvedExe = hposAsset(exe);
			const resolvedPack = hposAsset(pack);
			const sizes = GODOT_CONFIG.fileSizes || {};
			const wasmKey = exe + '.wasm';
			const resolvedWasm = resolvedExe + '.wasm';
			if (Object.prototype.hasOwnProperty.call(sizes, wasmKey) && !Object.prototype.hasOwnProperty.call(sizes, resolvedWasm)) {
				sizes[resolvedWasm] = sizes[wasmKey];
			}
			if (Object.prototype.hasOwnProperty.call(sizes, pack) && !Object.prototype.hasOwnProperty.call(sizes, resolvedPack)) {
				sizes[resolvedPack] = sizes[pack];
			}
			startOverride.executable = resolvedExe;
			startOverride.mainPack = resolvedPack;
		}
		engine.startGame(startOverride).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
