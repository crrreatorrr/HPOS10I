name: Web build

# Every branch: typecheck, tests, originality scan, the web build and its
# checks, and a browser smoke test; the build is kept as a downloadable
# artifact ("web-build", which the hub's `npm run fetch:games` downloads).
# main only: also deploy to GitHub Pages, once the repo variable
# PAGES_ENABLED is set to "true" (Pages must be switched on first).

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  # Absolute hub page for Exit to Hub, e.g. https://example.com/hub/
  # Unset keeps the dev default /hub/. Set the repo variable HPOS_HUB_URL when
  # the game origin and the hub origin differ.
  HPOS_HUB_URL: ${{ vars.HPOS_HUB_URL }}
  # Nakama's client server key (not the HTTP key). Unset builds still play, but
  # the server refuses every hub ticket, so no Tickets or Relics are recorded.
  HPOS_NAKAMA_SERVER_KEY: ${{ vars.HPOS_NAKAMA_SERVER_KEY }}
  # Public path this web build is served from. Unset keeps relative URLs, so
  # the same files work in any directory (GitHub Pages included).
  # Dev, game mounted at /play/hpos10i/: set the repo variable to /play/hpos10i/
  # Production at https://play.<domain>/hpos10i/: set it to /hpos10i/
  HPOS_BASE_PATH: ${{ vars.HPOS_BASE_PATH }}
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Originality scan
        run: tools/qa/originality_scan.sh .

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Check web build (sizes, dev content, audio formats, hub SDK)
        run: node tools/qa/web_check.mjs build/web

      - name: Install the smoke-test browser
        run: |
          npm install --no-save "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium

      - name: Browser smoke test (every scene, and the title-to-act path)
        run: node tools/qa/smoke.mjs build/web

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          include-hidden-files: true
          retention-days: 14

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
